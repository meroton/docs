name: Build and Test

on:
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Check git repository cleanliness
        run: git diff --exit-code HEAD --
